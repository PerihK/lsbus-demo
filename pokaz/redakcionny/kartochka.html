<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercedes-Benz Sprinter Black с водителем — LSBUS</title>
<meta name="theme-color" content="#f3f0ea">
<link rel="preload" href="../fonts/inter-tight-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/cormorant-garamond-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=20261117">
<meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body data-page="card">
<main>
  <section class="ch">
    <nav class="crumbs" id="crumbs"></nav>
    <h1 id="ttl"></h1>
    <div class="kv" id="kv"></div>
  </section>

  <section class="gal">
    <div class="gt" id="gt" data-cursor="Тяните"></div>
    <div class="gnav"><span class="idx" id="gcount">01 / 04</span><span class="bar"><i id="gbar"></i></span><span style="display:flex;gap:8px"><button id="gp" aria-label="Назад"><svg class="ar" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button><button id="gn" aria-label="Вперёд"><svg class="ar" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></span></div>
  </section>

  <section class="cbody">
    <span class="meta">(01) Описание</span>
    <div>
      <p class="lead" id="lead" data-words></p>
      <div class="amen-words" id="amen" data-r="up"></div>
      <div class="spec" id="spec" data-r="stagger"></div>
    </div>
  </section>

  <section class="cbody">
    <span class="meta">(02) Подходит для</span>
    <div><div class="fitw" id="fit" data-r="stagger"></div></div>
  </section>

  <section class="cbody" id="book">
    <span class="meta">(03) Бронирование</span>
    <div class="cbox" data-r="up">
      <div class="cq"><div class="lab"><span class="meta">Часов с подачей</span><div class="stepper"><button id="hm" aria-label="Меньше">−</button><b id="hv" style="font-size:28px;font-weight:500;letter-spacing:-.05em;min-width:40px;text-align:center">4</b><button id="hp" aria-label="Больше">+</button></div></div><span class="idx">Минимальный заказ — 3 часа + 1 час подачи</span></div>
      <div class="ctot"><div><small>Ориентировочно, точную сумму подтвердит оператор</small><div class="sum" id="sum">0 ₽</div></div><a class="pill" href="#" id="go" data-mag=".25"><span class="t"><i>Забронировать</i><i>Забронировать</i></span></a></div>
    </div>
  </section>

  <a class="next" id="next" href="#" data-cursor="Дальше"><div class="meta"><span>Следующая машина</span><span id="nidx"></span></div><div class="nm" id="nnm"></div><div class="ni"><img id="nimg" alt=""></div></a>
</main>

<div class="bbar" id="bbar">
  <div class="nm" id="bnm"></div><span class="sep"></span>
  <div class="st"><button id="bm" aria-label="Меньше">−</button><span id="bh">4 ч</span><button id="bp" aria-label="Больше">+</button></div>
  <span class="sum" id="bsum"></span>
  <a class="pill" href="#" id="bgo"><span class="t"><i>Забронировать</i><i>Забронировать</i></span></a>
</div>

<script src="../data.js"></script>
<script src="../vendor/gsap.min.js"></script>
<script src="../vendor/ScrollTrigger.min.js"></script>
<script src="../vendor/lenis.min.js"></script>
<script src="app.js?v=20261117"></script>
<script>
(function(){
const L = LS, G = window.gsap, d = document, $ = id => d.getElementById(id);
const id = new URLSearchParams(location.search).get('id') || 'sprinter-black';
const ci = Math.max(0, L.fleet.findIndex(x=>x.id===id)), c = L.fleet[ci];
const grp = L.groups.find(g=>g.id===c.group);
const short = c.name.replace(/^Mercedes-Benz /,''), parts = short.split(' '), last = parts.pop();
document.title = `${c.name} с водителем — аренда в Санкт-Петербурге | LSBUS`;

$('crumbs').innerHTML = `<a href="index.html" data-link>Главная</a><span>/</span><a href="index.html#park">Автопарк</a><span>/</span><span>${grp.name}</span>`;
$('ttl').innerHTML = (parts.length ? `<span class="ln"><span>${parts.join(' ')}</span></span>` : '') + `<span class="ln"><span><span class="serif">${last}</span></span></span>`;
$('kv').innerHTML = [['Мест', c.seats + (c.guide?' + гид':'')],['Час с водителем', rub(c.price)],['В парке', c.count ? c.count+' шт.' : '—'],['Класс', {bus:'Автобус',mini:'Микроавтобус',car:'Легковой'}[c.group]]]
  .map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');

/* gallery */
const gt = $('gt');
gt.innerHTML = c.photos.map(p=>`<figure><img src="${imgp(p)}" alt="${c.name}" draggable="false"></figure>`).join('');
gt.querySelectorAll('img').forEach(i => { const set = () => i.parentElement.style.setProperty('--ar', (i.naturalWidth/i.naturalHeight)||4/3); i.complete ? set() : i.onload = set; });
const figs = () => [...gt.children];
const upd = () => { const max = gt.scrollWidth - gt.clientWidth; const p = max>0 ? gt.scrollLeft/max : 1;
  $('gbar').style.transform = `scaleX(${Math.max(.08,p)})`;
  const n = figs().findIndex(f => f.offsetLeft + f.offsetWidth/2 >= gt.scrollLeft + 1) ;
  $('gcount').textContent = `${String(Math.min(c.photos.length, Math.max(1, Math.round(p*(c.photos.length-1))+1))).padStart(2,'0')} / ${String(c.photos.length).padStart(2,'0')}`; };
gt.addEventListener('scroll', upd, {passive:true}); upd();
const step = dir => { const w = figs()[0].offsetWidth + 20; gt.scrollBy({left: dir*w, behavior:'smooth'}); };
$('gp').onclick = () => step(-1); $('gn').onclick = () => step(1);
let down=false, sx=0, sl=0, moved=false;
gt.addEventListener('mousedown', e => { down=true; moved=false; sx=e.pageX; sl=gt.scrollLeft; gt.classList.add('drag'); });
addEventListener('mouseup', () => { if(!down) return; down=false; gt.classList.remove('drag'); });
addEventListener('mousemove', e => { if(!down) return; const dx = e.pageX-sx; if (Math.abs(dx)>3) moved=true; gt.scrollLeft = sl - dx*1.3; });
if (c.photos.length < 2) d.querySelector('.gnav').style.display='none';

/* body */
$('lead').innerHTML = c.text;
$('amen').innerHTML = c.amen.length ? c.amen.map(a=>`<span>${L.amen[a]}</span>`).join('<i>/</i>') : '';
$('spec').innerHTML = [['Тип', {bus:'Туристический автобус',mini:'Микроавтобус',car:'Легковой / минивэн'}[c.group]], ...c.specs, ['Стоимость', `от ${rub(c.price)} в час`], ['Минимальный заказ','3 часа + 1 час подачи']].map(([a,b])=>`<div><span>${a}</span><b style="font-weight:500">${b}</b></div>`).join('');
const fits = {bus:['tour','kids','intercity','staff','transfer'], mini:['wedding','transfer','staff','kids','tour'], car:['transfer','wedding']}[c.group];
$('fit').innerHTML = fits.map(f=>L.services.find(s=>s.id===f)).map(s=>`<a href="index.html#uslugi">${s.name}</a>`).join('');

/* booking */
let h = 4; const total = () => rub(c.price*h);
const render = () => { $('hv').textContent = h; $('bh').textContent = h+' ч'; $('sum').textContent = total(); $('bsum').textContent = total(); };
[['hm',-1],['hp',1],['bm',-1],['bp',1]].forEach(([k,v]) => $(k).onclick = () => { h = Math.min(14, Math.max(4, h+v)); render();
  G && G.fromTo(['#sum','#bsum'],{y:v*-8,opacity:.3},{y:0,opacity:1,duration:.5,ease:'expo.out'}); });
render();
$('bnm').innerHTML = `${short}<small>${c.seats} мест · ${rub(c.price)} / час</small>`;
['go','bgo'].forEach(k => $(k).onclick = e => { e.preventDefault(); openOrder(c.id); });
const mo = d.querySelector('.mbar .o'); if (mo) mo.dataset.order = c.id;

/* next */
const nx = L.fleet[(ci+1)%L.fleet.length], ns = nx.name.replace(/^Mercedes-Benz /,'').split(' '), nl = ns.pop();
$('next').href = `kartochka.html?id=${nx.id}`; $('nidx').textContent = `${String(((ci+1)%L.fleet.length)+1).padStart(2,'0')} / ${L.fleet.length}`;
$('nnm').innerHTML = (ns.length? ns.join(' ')+' ' : '') + `<span class="serif">${nl}</span>`; $('nimg').src = imgp(nx.photos[0]);

LSApp.ready(() => {
  const bb = $('bbar');
  const showBar = y => bb.classList.toggle('on', y > innerHeight*.7 && $('book').getBoundingClientRect().top > innerHeight*.9);
  (window.LENIS ? (LENIS.on('scroll', e=>showBar(e.scroll)), 0) : addEventListener('scroll', ()=>showBar(scrollY), {passive:true}));
  if (!G) return;
  G.timeline()
   .from('#ttl .ln>span',{yPercent:120,rotate:4,duration:1.5,ease:'expo.out',stagger:.1})
   .from('#crumbs,#kv>div',{y:24,autoAlpha:0,duration:1,ease:'expo.out',stagger:.06},'-=1.1')
   .from('#gt figure',{x:160,autoAlpha:0,duration:1.6,ease:'expo.out',stagger:.08},'-=1.1')
   .from('#gt figure img',{scale:1.25,duration:2,ease:'expo.out',stagger:.08},'<');
});
})();
</script>
</body>
</html>
